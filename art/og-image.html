<!-- The design source of docs/og-image.png, 1200 by 630: the manual's cover as a card. A reference, not shipped:
     the PNGs are the assets, and are rendered from this. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap">
<style>
body { margin: 0; background: #15130F; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { opacity: 0.8; }
</style>
</helmet>
<div data-screen-label="OG image" style="position: relative; width: 1200px; height: 630px; background: linear-gradient(115deg, #f1ebde 0%, #ece5d6 45%, #E6DFD0 100%); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div style="position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; background: radial-gradient(620px 300px at 18% 8%, rgba(120,100,60,0.06), transparent 70%), radial-gradient(520px 420px at 88% 94%, rgba(105,85,50,0.08), transparent 70%), radial-gradient(140px 90px at 72% 30%, rgba(110,90,55,0.05), transparent 70%), radial-gradient(closest-side at 50% 50%, transparent 55%, rgba(90,72,42,0.09) 100%), repeating-linear-gradient(0deg, rgba(110,90,60,0.02) 0 1px, transparent 1px 3px);"></div>
  <div style="position: absolute; left: 36px; top: 18%; width: 20px; height: 20px; border-radius: 50%; background: #15130F; box-shadow: inset 0 2px 3px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.4);"></div>
  <div style="position: absolute; left: 36px; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: #15130F; box-shadow: inset 0 2px 3px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.4);"></div>
  <div style="position: absolute; left: 36px; top: 82%; width: 20px; height: 20px; border-radius: 50%; background: #15130F; box-shadow: inset 0 2px 3px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.4);"></div>
  <div style="position: relative; text-align: center;">
    <h1 style="font: 800 250px/0.9 'JetBrains Mono', ui-monospace, monospace; letter-spacing: -0.02em; color: #15130F; margin: 0; text-transform: uppercase;">CONN</h1>
    <div style="margin: 30px auto 0; width: 640px; background: #C34E27; color: #f1ebde; font: 800 26px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.3em; padding: 16px 0 15px; text-indent: 0.3em;">OPERATING MANUAL</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630}}"></script>
</body>
</html>
