# goreleaser builds the release install.sh downloads from. The names are the
# contract: conn_<version>_<os>_<arch>.tar.gz holding conn and its manpage,
# beside a checksums.txt — exactly what the hand-rolled workflow produced,
# now with the changelog and the rest for free. `goreleaser release
# --snapshot --clean` rehearses the whole thing locally.
version: 2

project_name: conn

# The man page in the archive is stamped with the release being cut,
# rather than the one it last recorded. The stamped copy goes in build/,
# which git ignores: stamping man/conn.1 itself would leave the tree
# dirty and every binary marked MODIFIED. Not dist/, which goreleaser
# insists is empty after the hooks have run.
before:
  hooks:
    - mkdir -p build
    - cp man/conn.1 build/conn.1
    - >-
      perl -pi -e 's/^\.TH CONN 1 "[^"]*" "conn [^"]*"/.TH CONN 1 "{{ .Now.Format "2006-01-02" }}" "conn {{ .Version }}"/' build/conn.1

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "conn_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: build/conn.1
        dst: conn.1

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
