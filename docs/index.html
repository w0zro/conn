<!-- The station fills the window: the panel and the workspace, and the
     band across the foot. site.js draws it the way conn draws it, rows
     of cells on the terminal's grid: the console first, then the panel
     over a machine that runs in this page, worked with conn's keys. -->
<div id="station" class="station" aria-label="conn">
  <div class="screen">
    <pre class="panel" id="panel"></pre>
    <pre class="work" id="work"></pre>
  </div>
  <div class="band" id="band">
    <pre class="b0" id="b0"></pre>
    <pre class="b1" id="b1"></pre>
  </div>
</div>

<h1>conn</h1>
<p>A console for the processes working your projects. Every process on one machine under the project it works; what each project wants of you; the one you choose, in front of you. macOS and Linux, on tmux.</p>
<pre>
   conn ────────────────────────  WAITING
▸  ☿ 0 claude                       9 MIN
   ❯   zsh
 ⣾ ○   go test ./...

   web ─────────────────────────  STOPPED
   ❯   zsh
   ▯   vim                       STOPPED
   ◉   postgres                    :5432
   ○   node vite                   :5173
   ○   worker                       DOWN
</pre>
<p><code>curl -fsSL https://conn.w0zro.com/install.sh | sh</code></p>
