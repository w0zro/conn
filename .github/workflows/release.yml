# Pushing a v* tag runs the tests and hands the build to goreleaser, which
# produces what install.sh expects — conn_<version>_<os>_<arch>.tar.gz with
# the manpage inside, beside a checksums.txt — plus the changelog. The
# artifact names are .goreleaser.yaml's contract; rehearse changes to it with
# `goreleaser release --snapshot --clean`.
#
# The tests run on macOS because that is where conn is developed; the push
# workflow has already run them on Linux by the time any tag is cut. They
# hold their shells in a real tmux, which the runner does not carry, and
# under CI a missing tmux is a failure rather than a skip.
#
# Once the release is out, the manual records it: tools/revisions writes
# the record of revisions on the site's cover from the tags, tools/man
# writes the man page from the manual so its stamp follows, and both are
# pushed to main — a push without a tag, which is the one Pages rebuilds
# on. The tag's message is the row's description, so the tag is cut with
# one: git tag -a v0.4.0 -m "Endings, tasks and the transcript".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Neighbors
        run: brew install tmux

      - name: Test
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  record:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Record the revision
        run: go run ./tools/revisions && go run ./tools/man

      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html man/conn.1
          git diff --cached --quiet && exit 0
          git commit -m "The manual records ${GITHUB_REF_NAME}"
          git push origin main
